<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="中国历代疆域交互地图：切换朝代查看疆域轮廓与大事年表" />
    <title>华夏疆域 · 历代演变</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>华夏疆域</h1>
        <span class="seal" aria-hidden="true">疆</span>
        <span class="sub">历代疆域与大事 · 交互地图</span>
      </div>
      <div class="toggles">
        <label class="toggle" title="显示本朝政区界（郡/州/路/府），悬浮查看政区名">
          <input type="checkbox" id="division-toggle" checked />
          <span>政区界</span>
        </label>
        <label class="toggle" title="叠加现代国界与省界作古今对照">
          <input type="checkbox" id="modern-toggle" checked />
          <span>现代界线</span>
        </label>
        <div class="settings">
          <button id="settings-btn" title="显示设置" aria-expanded="false" aria-haspopup="true">⚙</button>
          <div id="settings-panel" hidden>
            <div class="settings-title">显 示 设 置</div>
            <div class="settings-row">
              <label for="div-font-range">政区字号</label>
              <input type="range" id="div-font-range" min="9" max="20" step="1" />
              <output id="div-font-val">12px</output>
            </div>
            <button id="div-font-reset" type="button">恢复默认字号</button>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div id="map"></div>
      <div id="div-tip" hidden></div>
      <div id="map-hint" aria-hidden="true">双指缩放地图 · 点下方年代节点切换断面</div>
      <div id="event-card">
        <button id="card-close" aria-label="关闭事件详情">×</button>
        <div class="card-head">
          <span class="card-year"></span>
          <span class="card-loc"></span>
        </div>
        <h3 class="card-title"></h3>
        <p class="card-desc"></p>
      </div>
      <aside id="sidebar">
        <div class="drawer-grip" id="drawer-grip" aria-label="收起大事年表"></div>
        <div id="dynasty-info"></div>
        <div id="event-list"></div>
      </aside>
      <button id="drawer-btn" aria-label="打开大事年表">大事<br />年表</button>
    </main>

    <footer class="app-footer">
      <nav id="timeline" aria-label="时间轴：滚动浏览历代断面，点击节点切换地图"></nav>
      <p class="disclaimer">
        疆域与政区边界为开源数据简化示意（部分界线为治所 Voronoi 示意，三国魏蜀吴与秦等为手绘），与谭其骧《中国历史地图集》等学术口径存在差异，仅供历史学习参考。
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
