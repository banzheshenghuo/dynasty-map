<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="中国历代疆域交互地图：切换朝代查看疆域轮廓与大事年表" />
    <title>华夏疆域 · 历代演变</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>华夏疆域</h1>
        <span class="seal" aria-hidden="true">疆</span>
        <span class="sub">历代疆域与大事 · 交互地图</span>
      </div>
      <label class="toggle" title="叠加现代国界与省界作古今对照">
        <input type="checkbox" id="modern-toggle" checked />
        <span>现代界线</span>
      </label>
    </header>

    <main class="app-main">
      <div id="map"></div>
      <div id="map-hint" aria-hidden="true">双指缩放地图 · 点圆点看详情</div>
      <div id="event-card">
        <button id="card-close" aria-label="关闭事件详情">×</button>
        <div class="card-head">
          <span class="card-year"></span>
          <span class="card-loc"></span>
        </div>
        <h3 class="card-title"></h3>
        <p class="card-desc"></p>
      </div>
      <aside id="sidebar">
        <div class="drawer-grip" id="drawer-grip" aria-label="收起大事年表"></div>
        <div id="dynasty-info"></div>
        <div id="event-list"></div>
      </aside>
      <button id="drawer-btn" aria-label="打开大事年表">大事<br />年表</button>
    </main>

    <footer class="app-footer">
      <nav id="timeline" aria-label="朝代时间轴"></nav>
      <p class="disclaimer">
        疆域边界为开源数据简化示意（秦为手绘示意），与谭其骧《中国历史地图集》等学术口径存在差异，仅供历史学习参考。
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
